name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release that is in progress

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create GitHub releases and push version commits
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to open "Version Packages" PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is needed so changesets can compute the diff
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Changesets action ────────────────────────────────────────
      # When changesets are present  → opens / updates a "Version Packages" PR
      # When the version PR is merged → creates a GitHub release + triggers Tauri build
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Trigger Tauri cross-platform build on release ────────────
      - name: Trigger Tauri build on new release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: context.ref,
              inputs: {
                tag: '${{ steps.changesets.outputs.publishedPackages }}'
              }
            })
