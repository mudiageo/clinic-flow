name: 'Tauri Build Workflow'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0, v0.2.0-beta.1, v0.2.0-nightly.20260914)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
      release_name:
        description: 'Override release name'
        required: false
        default: ''
  push:
    tags:
      - 'v*' # triggers on any version tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Determine release metadata ────────────────────────────────────
  metadata:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute metadata
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          INPUT_TAG="${{ inputs.tag }}"
          TAG="${INPUT_TAG:-v$PKG_VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Detect channel from version string
          if [[ "$TAG" == *"-nightly."* ]]; then
            CHANNEL="nightly"
            PRERELEASE="true"
            NAME="${{ inputs.release_name || 'Nightly Build' }} ($TAG)"
          elif [[ "$TAG" == *"-alpha."* ]]; then
            CHANNEL="alpha"
            PRERELEASE="true"
            NAME="ClinicFlow $TAG (Alpha)"
          elif [[ "$TAG" == *"-beta."* ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
            NAME="ClinicFlow $TAG (Beta)"
          else
            CHANNEL="stable"
            PRERELEASE="${{ inputs.prerelease || 'false' }}"
            NAME="ClinicFlow $TAG"
          fi

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT

  # ── Cross-platform Tauri builds ───────────────────────────────────
  build-app:
    name: Build (${{ matrix.platform }} ${{ matrix.rust_target || 'default' }})
    needs: metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            is_android: false
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            is_android: false
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'ubuntu-22.04-arm'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target aarch64'
            rust_target: 'aarch64-linux-android'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target armv7'
            rust_target: 'armv7-linux-androideabi'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target x86_64'
            rust_target: 'x86_64-linux-android'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target i686'
            rust_target: 'i686-linux-android'
            is_android: true
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu desktop only)
        if: (matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm') && !matrix.is_android
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup java (android only)
        if: matrix.is_android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup android SDK (android only)
        if: matrix.is_android
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: install NDK (android only)
        if: matrix.is_android
        run: sdkmanager "ndk;25.2.9519653"

      - name: set NDK path (android only)
        if: matrix.is_android
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies
        run: vp install

      - name: build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: 'file:dummy.db'
          BETTER_AUTH_SECRET: 'dummy-secret'
          ORIGIN: 'http://localhost:5173'
          TAURI: '1'
        with:
          tagName: ${{ needs.metadata.outputs.tag }}
          releaseName: ${{ needs.metadata.outputs.release_name }}
          releaseBody: |
            **Channel:** `${{ needs.metadata.outputs.channel }}`

            See the full [CHANGELOG](https://github.com/mudiageo/clinic-flow/blob/main/CHANGELOG.md) for details.

            > ⚠️ **Nightly/Alpha/Beta builds** are experimental and not recommended for production PHC use.
          releaseDraft: ${{ needs.metadata.outputs.channel == 'stable' }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          uploadPlainBinary: true
          tauriScript: ${{ matrix.is_android && 'vp exec tauri' || '' }}
          mobile: ${{ matrix.is_android && 'android' || '' }}
          args: ${{ matrix.args }}

  # ── Hybrid Nightly Strategy (Static Pointer & Retention) ──────────
  update-nightly-pointer:
    name: Update Static Nightly & Cleanup
    needs: [metadata, build-app]
    if: needs.metadata.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Recreate Static Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.metadata.outputs.tag }}
        run: |
          # 1. Download all assets from the freshly built timestamped release
          gh release download "$TAG_NAME" --dir release-assets || echo "No assets found"

          # 2. Delete the old static nightly release and tag
          gh release delete nightly --cleanup-tag -y || true

          # 3. Recreate the nightly release pointing to the current commit with the same assets
          if [ -d "release-assets" ]; then
            gh release create nightly ./release-assets/*               --title "Nightly Build"               --notes "This is the static pointer to the latest nightly build. For specific historical builds (7-day retention), see the timestamped releases."               --prerelease
          else
            gh release create nightly               --title "Nightly Build"               --notes "This is the static pointer to the latest nightly build."               --prerelease
          fi

      - name: Cleanup Old Nightlies (7-Day Retention)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 7
          delete_tags: true
          delete_tag_pattern: '.*-nightly.*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
