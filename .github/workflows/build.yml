name: 'Tauri Build Workflow'
on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-app:
    name: Build (${{ matrix.platform }} ${{ matrix.rust_target || 'default' }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            is_android: false
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            is_android: false
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'ubuntu-22.04-arm'
            args: ''
            rust_target: ''
            is_android: false
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target aarch64'
            rust_target: 'aarch64-linux-android'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target armv7'
            rust_target: 'armv7-linux-androideabi'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target x86_64'
            rust_target: 'x86_64-linux-android'
            is_android: true
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --debug --target i686'
            rust_target: 'i686-linux-android'
            is_android: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu desktop only)
        if: (matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm') && !matrix.is_android
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup java (android only)
        if: matrix.is_android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup android SDK (android only)
        if: matrix.is_android
        uses: android-actions/setup-android@v3

      - name: install NDK (android only)
        if: matrix.is_android
        run: sdkmanager "ndk;25.2.9519653"

      - name: set NDK path (android only)
        if: matrix.is_android
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*
          cache: true
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: install dependencies
        run: vp install
        
      - name: build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "file:dummy.db"
          BETTER_AUTH_SECRET: "dummy-secret"
          ORIGIN: "http://localhost:5173"
          TAURI: "1"
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'Automated cross-platform build.'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
          tauriScript: ${{ matrix.is_android && 'vp exec tauri' || '' }}
          mobile: ${{ matrix.is_android && 'android' || '' }}
          args: ${{ matrix.args }}
