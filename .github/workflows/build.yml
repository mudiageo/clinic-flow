name: 'Tauri Build Workflow'
on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*
          cache: true
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: install dependencies
        run: vp install
        
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: "sqlite://dummy.db"
          BETTER_AUTH_SECRET: "dummy-secret"
          ORIGIN: "http://localhost:5173"
          TAURI: "1"
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'Automated cross-platform build.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    name: Build Android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*
          cache: true
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: setup android SDK
        uses: android-actions/setup-android@v3
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: install NDK
        run: sdkmanager "ndk;25.2.9519653"
      - name: set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: install dependencies
        run: vp install
      - name: build android
        run: vp run build:android
        env:
          DATABASE_URL: "sqlite://dummy.db"
          BETTER_AUTH_SECRET: "dummy-secret"
          ORIGIN: "http://localhost:5173"
          TAURI: "1"
        continue-on-error: true
