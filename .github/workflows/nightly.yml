name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every night
    - cron: '0 0 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  nightly:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Get current version and date
        id: info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y%m%d')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-nightly.${DATE}" >> $GITHUB_OUTPUT

      - name: Enter nightly pre-release mode
        run: pnpm changeset pre enter nightly

      - name: Bump to nightly version
        run: |
          # Override the pre-release tag with date-based suffix
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            const base = pkg.version.split('-')[0];
            pkg.version = base + '-nightly.${{ steps.info.outputs.date }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "

      - name: Trigger Tauri nightly build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: context.ref,
              inputs: {
                prerelease: 'true',
                release_name: 'Nightly ${{ steps.info.outputs.date }}',
                tag: '${{ steps.info.outputs.tag }}'
              }
            });
