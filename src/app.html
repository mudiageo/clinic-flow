<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Global Missing Config Intercept: Prevent boot if unpaired
			(function() {
				var publicRoutes = ['/welcome', '/connect', '/onboarding'];
				if (!publicRoutes.includes(window.location.pathname) && !window.location.pathname.startsWith('/__')) {
					if (!localStorage.getItem('clinicflow_server_url') && !localStorage.getItem('clinicflow_is_master')) {
						window.location.replace('/welcome');
					}
				}
			})();

		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
