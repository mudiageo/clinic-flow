<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Global Missing Config Intercept: Prevent boot if unpaired
			(function() {
				var path = window.location.pathname;
				var exactPublicRoutes = ['/', '/welcome', '/connect', '/onboarding', '/download', '/login', '/register'];
				var isPublic = exactPublicRoutes.includes(path) || path.startsWith('/support') || path.startsWith('/__');
				
				if (!isPublic) {
					if (!localStorage.getItem('clinicflow_server_url') && !localStorage.getItem('clinicflow_is_master')) {
						window.location.replace('/welcome');
					}
				}
			})();

		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
